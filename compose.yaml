services:
  frontend:
    image: ${IMAGE_URI:-leila-sinor-ebooks-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://www.leilasinorebooksapi.online}
    ports:
      - "${HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
