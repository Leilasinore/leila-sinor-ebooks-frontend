name: Deploy frontend to EC2 with SSM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_SECRET_ID: ${{ vars.AWS_SECRET_ID }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
  DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REPOSITORY AWS_SECRET_ID EC2_INSTANCE_ID EC2_DEPLOY_PATH AWS_ROLE_ARN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing GitHub production variable: $name" >&2
              exit 1
            fi
          done

          if ! printf '%s' "$AWS_REGION" | grep -Eq '^[a-z]{2}(-[a-z]+)+-[0-9]+$'; then
            echo "AWS_REGION is not a valid AWS Region identifier: $AWS_REGION" >&2
            exit 1
          fi
          if ! printf '%s' "$EC2_INSTANCE_ID" | grep -Eq '^i-([0-9a-f]{8}|[0-9a-f]{17})$'; then
            echo "EC2_INSTANCE_ID is not a valid EC2 instance ID: $EC2_INSTANCE_ID" >&2
            exit 1
          fi
          if ! printf '%s' "$AWS_SECRET_ID" | grep -Eq '^[A-Za-z0-9/_+=.@:-]+$'; then
            echo "AWS_SECRET_ID contains unsupported characters." >&2
            exit 1
          fi
          if ! printf '%s' "$EC2_DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$' || printf '%s' "$EC2_DEPLOY_PATH" | grep -q '\.\.'; then
            echo "EC2_DEPLOY_PATH must be an absolute path without spaces or '..'." >&2
            exit 1
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EC2 is online in Systems Manager
        run: |
          set -euo pipefail
          ping_status=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          if [ "$ping_status" != "Online" ]; then
            echo "EC2 instance $EC2_INSTANCE_ID is not online in Systems Manager (status: $ping_status)." >&2
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.IMAGE_URI }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Systems Manager deployment payload
        run: |
          set -euo pipefail
          deployment_archive=$(tar -czf - \
            compose.yaml \
            deploy/nginx/app.leilasinorebooksapi.online.conf \
            scripts/deploy-ec2.sh | base64 --wrap=0)

          jq -n \
            --arg archive "$deployment_archive" \
            --arg deploy_path "$EC2_DEPLOY_PATH" \
            --arg image_uri "$IMAGE_URI" \
            --arg secret_id "$AWS_SECRET_ID" \
            --arg aws_region "$AWS_REGION" \
            '{
              commands: [
                "set -eu",
                ("install -d -m 755 " + ($deploy_path | @sh)),
                ("printf %s " + ($archive | @sh) + " | base64 -d | tar -xzf - -C " + ($deploy_path | @sh)),
                ("chmod +x " + (($deploy_path + "/scripts/deploy-ec2.sh") | @sh)),
                ("cd " + ($deploy_path | @sh) + " && scripts/deploy-ec2.sh " + ($image_uri | @sh) + " " + ($secret_id | @sh) + " " + ($aws_region | @sh))
              ],
              executionTimeout: ["900"]
            }' > "$RUNNER_TEMP/ssm-deploy-parameters.json"

      - name: Deploy and verify through Systems Manager
        timeout-minutes: 16
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy frontend $GITHUB_SHA" \
            --parameters "file://$RUNNER_TEMP/ssm-deploy-parameters.json" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "Systems Manager command ID: $command_id"

          attempt=1
          while [ "$attempt" -le 180 ]; do
            if invocation_json=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>&1); then
              status=$(printf '%s' "$invocation_json" | jq -r '.Status')
              echo "Systems Manager command status: $status"

              case "$status" in
                Success)
                  printf '%s' "$invocation_json" | jq '{
                    Status,
                    ResponseCode,
                    StandardOutputContent,
                    StandardErrorContent
                  }'
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut)
                  printf '%s' "$invocation_json" | jq '{
                    Status,
                    StatusDetails,
                    ResponseCode,
                    StandardOutputContent,
                    StandardErrorContent
                  }'
                  exit 1
                  ;;
              esac
            else
              if ! printf '%s' "$invocation_json" | grep -q 'InvocationDoesNotExist'; then
                printf '%s\n' "$invocation_json" >&2
                exit 1
              fi
            fi

            attempt=$((attempt + 1))
            sleep 5
          done

          echo "Systems Manager command did not finish within 15 minutes; cancelling it." >&2
          aws ssm cancel-command --command-id "$command_id" >/dev/null || true
          exit 1
